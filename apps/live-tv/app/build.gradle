plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.livetv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.livetv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Media3 (ExoPlayer) plays the streams: HLS for the .m3u8 channels, DASH for the .mpd ones.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // One Kotlin version for every stdlib artifact, so the jdk7/jdk8 ones stay empty stubs.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
